<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="assets/favicon/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="assets/favicon/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
    <title>Coffee House</title>
</head>
<body>
    <header class="header container">
        <div class="logo">
            <a href="index.html" class="logo__link" aria-label="Resource Coffee House — Home">
                <img src="assets/icons/logo.svg" alt="Resource Coffee House" class="logo__img">
                <h1>Resorce Coffee House</h1>
            </a>
        </div>
        <nav class="nav nav--main" aria-label="main navigation">
            <ul class="nav__list">
                <li><a href="index.html#favorite">Favorite coffee</a></li>
                <li><a href="index.html#about">About</a></li>
                <li><a href="index.html#mobile">Mobile app</a></li>
                <li><a href="#contacts">Contact us</a></li>
            </ul>
        </nav>
        <div class="menu-holder">
            <div class="theme-toggle-wrapper">
                <button type="button" class="theme-toggle" aria-label="Switch theme">
                    <img src="assets/icons/Light.svg" alt="Light Theme" class="light__toggle">
                    <img src="assets/icons/Dark.svg" alt="Dark Theme" class="dark__toggle">              
                </button>
            </div>
            <div class="menu-link">
                <a href="coffee.html" class="menu-link__anchor">
                    Menu
                    <span class="menu-link__icon">
                        <img src="assets/icons/coffee-cup.svg" alt="Coffee Cup" class="coffee_cup_icon">
                    </span>
                </a>
            </div>
        </div>     
    </header>
    <main class="container">
        <div class="menu-offer">
            <div class="motto"></div>
            <nav class="nav-toggle">
                <button type="button" class="menu-toggle" aria-label="Coffee">
                    <img src="assets/icons/icon.svg" alt="Coffee" class="menu-light__toggle">                                
                </button>
                <button type="button" class="menu-toggle" aria-label="Coffee">
                    <img src="assets/icons/icon(1).svg" alt="Coffee" class="menu-light__toggle">                                
                </button>
                <button type="button" class="menu-toggle" aria-label="Coffee">
                    <img src="assets/icons/icon(2).svg" alt="Coffee" class="menu-light__toggle">                                
                </button>
            </nav>
        </div>
        <div class="grid">
            <div>1</div>
            <div>2</div>
            <div>3</div>
            <div>4</div>
            <div>5</div>
            <div>6</div>
            <div>7</div>
            <div>8</div>
        </div>
    </main>
    <footer class="footer container" id="contacts">
        <div class="footer-container">
            <div class="footer-cell">
                <div class="footer-offer">
                    <p class="offer">Sip, Savor, Smile.</p>
                    <p class="offer accent">It’s coffee time!</p>
                </div>
                <div class="offer-social">
                    <img src="assets/icons/button-icon-light.svg" alt="icon-twitter" class="icon-social">
                    <img src="assets/icons/button-icon-light (1).svg" alt="icon-instagram" class="icon-social">
                    <img src="assets/icons/button-icon-light (2).svg" alt="icon-meta" class="icon-social">
                </div>
            </div>
            <div class="footer-cell">
                <h3>Contact Us</h3>
                <ul class="footer__list">
                    <li>
                        <img src="assets/icons/pin-alt.svg" alt="pin-alt">  Green Rd., LA                        
                    </li>
                    <li>
                        <img src="assets/icons/phone.svg" alt="phone">  +1(603) 55-0123                        
                    </li>
                    <li>
                        <img src="assets/icons/clock.svg" alt="clock">  Mon–Sat: 9:00–23:00                        
                    </li>
                </ul>
            </div>
        </div>
    </footer>    
</body>
</html>
